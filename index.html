<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบค้นหาเวรทนายความอาสา</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; background: #f0f4f8; min-height: 100vh; }

.header {
  background: linear-gradient(135deg, #1a3a5c 0%, #1d6fa4 100%);
  color: white; padding: 22px 20px; text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.header h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.01em; }
.header p { font-size: 0.85rem; opacity: 0.8; }

.container { max-width: 920px; margin: 0 auto; padding: 18px 14px; }

.search-box {
  background: white; border-radius: 16px; padding: 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 16px;
}
.search-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap input {
  width: 100%; padding: 11px 14px 11px 40px;
  border: 2px solid #e2e8f0; border-radius: 10px;
  font-size: 1rem; font-family: inherit; transition: border-color .2s;
}
.search-wrap input:focus { outline: none; border-color: #1d6fa4; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1.1rem; }
select {
  padding: 11px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
  font-size: .9rem; font-family: inherit; background: white; cursor: pointer; transition: border-color .2s;
}
select:focus { outline: none; border-color: #1d6fa4; }

.chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.chip-label { font-size: .82rem; color: #64748b; }
.chip {
  padding: 5px 13px; border-radius: 18px; border: 2px solid #e2e8f0;
  background: white; cursor: pointer; font-size: .83rem; font-family: inherit;
  transition: all .18s; color: #475569;
}
.chip:hover { border-color: #1d6fa4; color: #1d6fa4; }
.chip.on { background: #1d6fa4; border-color: #1d6fa4; color: white; font-weight: 600; }

.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat {
  background: white; border-radius: 12px; padding: 11px 18px; flex: 1; min-width: 120px;
  text-align: center; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.stat .n { font-size: 1.7rem; font-weight: 700; color: #1d6fa4; line-height: 1.1; }
.stat .l { font-size: .78rem; color: #64748b; margin-top: 3px; }

.rhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.rcount { font-size: .88rem; color: #64748b; }
.sort-btns { display: flex; gap: 6px; }
.sbtn {
  padding: 6px 13px; background: white; border: 2px solid #e2e8f0;
  border-radius: 8px; cursor: pointer; font-size: .82rem; font-family: inherit;
  color: #475569; transition: all .18s;
}
.sbtn:hover { border-color: #1d6fa4; color: #1d6fa4; }
.sbtn.on { background: #1d6fa4; border-color: #1d6fa4; color: white; }

.card {
  background: white; border-radius: 14px; margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.055); overflow: hidden; cursor: pointer;
  transition: box-shadow .2s, transform .18s;
}
.card:hover { box-shadow: 0 6px 22px rgba(0,0,0,0.1); transform: translateY(-1px); }

.card-top {
  display: flex; align-items: center; padding: 14px 18px; gap: 12px;
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.card-top.open { border-color: #e2e8f0; }

.avatar {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 700; color: white; flex-shrink: 0;
}
.cinfo { flex: 1; min-width: 0; }
.cname { font-size: 1rem; font-weight: 700; color: #1e293b; }
.cphone { font-size: .82rem; color: #64748b; margin-top: 2px; }
.cbadges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.badge {
  padding: 3px 9px; border-radius: 7px; font-size: .78rem; font-weight: 600; white-space: nowrap;
}
.bd { background: #eff6ff; color: #1d4ed8; }
.bl { background: #f0fdf4; color: #15803d; }
.exp { color: #94a3b8; transition: transform .28s; font-size: 1rem; }
.exp.open { transform: rotate(180deg); }

.card-body { display: none; padding: 14px 18px; }
.card-body.open { display: block; }

.sec-title { font-size: .75rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }

.bars { display: flex; flex-direction: column; gap: 5px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-lbl { font-size: .83rem; color: #475569; min-width: 138px; }
.bar-track { flex: 1; height: 7px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-cnt { font-size: .83rem; font-weight: 600; color: #1e293b; min-width: 20px; text-align: right; }

.month-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.mtag {
  padding: 3px 10px; border-radius: 6px; font-size: .78rem;
  font-weight: 600; background: #f1f5f9; color: #64748b;
}
.mtag.hi { background: #1d6fa4; color: white; }

.date-list { display: flex; flex-wrap: wrap; gap: 5px; }
.dchip {
  padding: 3px 9px; background: #f8fafc; border: 1px solid #e2e8f0;
  border-radius: 6px; font-size: .75rem; color: #475569;
}

.section { margin-top: 12px; }

.empty { text-align: center; padding: 52px 20px; color: #94a3b8; }
.empty .ico { font-size: 2.8rem; margin-bottom: 10px; }

@media(max-width:600px){
  .bar-lbl { min-width: 90px; font-size: .78rem; }
  .cbadges { gap: 5px; }
}
</style>
</head>

  <div id="list"></div>
</div>

const LC={'ศาลจังหวัดพระประแดง':'#3b82f6','บ้านคลองสวน':'#10b981','พระประแดง':'#8b5cf6','พระสมุทรเจดีย์':'#f59e0b','สำโรงใต้':'#ef4444'};
const AV=['#1d6fa4','#059669','#7c3aed','#c2410c','#b91c1c','#0284c7','#4f46e5','#0891b2'];
let cm='', cs='d';

function setM(m){ cm=m; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); event.target.classList.add('on'); render(); }
function setSort(s){ cs=s; document.getElementById('sd').classList.toggle('on',s==='d'); document.getElementById('sn').classList.toggle('on',s==='n'); render(); }

function initial(n){ return (n.replace(/^(นาย|นางสาว|นาง |ว่าที่ร้อยตรี |พ\.ต\.อ\.? )/,'')||'?')[0]; }

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const loc=document.getElementById('loc').value;
  let entries=Object.entries(D);

  entries=entries.filter(([n,d])=>{
    if(q && !n.toLowerCase().includes(q) && !(d.phone||'').includes(q)) return false;
    if(cm && !d.months[cm]) return false;
    if(loc && !d.locations[loc]) return false;
    return true;
  });

  if(cs==='d'){
    entries.sort((a,b)=>{
      const va=cm?(a[1].months[cm]||0):a[1].total_days;
      const vb=cm?(b[1].months[cm]||0):b[1].total_days;
      return vb-va;
    });
  } else {
    entries.sort((a,b)=>a[0].localeCompare(b[0],'th'));
  }

  const totalDays=entries.reduce((s,[,d])=>s+(cm?(d.months[cm]||0):d.total_days),0);
  const locs=new Set(); entries.forEach(([,d])=>Object.keys(d.locations).forEach(l=>locs.add(l)));
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${entries.length}</div><div class="l">ทนายความ</div></div>
    <div class="stat"><div class="n">${totalDays}</div><div class="l">วันเวรรวม</div></div>
    <div class="stat"><div class="n">${locs.size}</div><div class="l">สถานที่</div></div>`;
  document.getElementById('rc').textContent='พบ '+entries.length+' คน';

  if(!entries.length){
    document.getElementById('list').innerHTML='<div class="empty"><div class="ico">🔎</div><div>ไม่พบข้อมูล</div></div>';
    return;
  }

  document.getElementById('list').innerHTML=entries.map(([name,d],i)=>{
    const col=AV[i%AV.length];
    const ini=initial(name);
    const days=cm?(d.months[cm]||0):d.total_days;
    const locs=Object.entries(d.locations);
    const maxL=Math.max(...locs.map(([,v])=>v));
    const barsH=locs.map(([l,c])=>`<div class="bar-row"><span class="bar-lbl">${l}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxL*100)}%;background:${LC[l]||'#64748b'}"></div></div><span class="bar-cnt">${c}</span></div>`).join('');
    const mtagsH=Object.entries(d.months).map(([m,c])=>`<span class="mtag ${cm===m?'hi':''}">${m} (${c})</span>`).join('');
    let details=d.details; if(cm) details=details.filter(x=>x.month===cm);
    const dH=details.map(x=>`<span class="dchip">${x.date.replace(' 2569','')} · ${x.location.replace('ศาลจังหวัด','ศาล')}</span>`).join('');
    return `<div class="card" onclick="tog(this)">
      <div class="card-top">
        <div class="avatar" style="background:${col}">${ini}</div>
        <div class="cinfo"><div class="cname">${name}</div><div class="cphone">${d.phone?'📞 '+d.phone:''}</div></div>
        <div class="cbadges"><span class="badge bd">📅 ${days} วัน</span><span class="badge bl">📍 ${Object.keys(d.locations).length} แห่ง</span></div>
        <span class="exp">▼</span>
      </div>
      <div class="card-body">
        <div class="sec-title">สถานที่ปฏิบัติงาน</div>
        <div class="bars">${barsH}</div>
        <div class="section"><div class="sec-title">เดือน</div><div class="month-tags">${mtagsH}</div></div>
        <div class="section"><div class="sec-title">วันที่ ${cm?'('+cm+')':'(ทั้งหมด)'}</div><div class="date-list">${dH}</div></div>
      </div>
    </div>`;
  }).join('');
}

function tog(card){
  const top=card.querySelector('.card-top');
  const body=card.querySelector('.card-body');
  const exp=card.querySelector('.exp');
  const o=body.classList.contains('open');
  body.classList.toggle('open',!o);
  top.classList.toggle('open',!o);
  exp.classList.toggle('open',!o);
}
render();
